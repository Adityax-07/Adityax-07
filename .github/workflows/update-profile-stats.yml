name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 0"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate self-hosted SVG stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py

      - name: Commit changed assets
        shell: bash
        run: |
          if git diff --quiet -- assets/stats-light.svg assets/stats-dark.svg; then
            echo "Profile stats are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          git commit -m "chore: refresh profile stats"
          git push

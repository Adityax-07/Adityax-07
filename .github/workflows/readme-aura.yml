name: readme-aura

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build README
        run: npx readme-aura@latest build -g Adityax-07 -t ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config --global user.name "readme-aura[bot]"
          git config --global user.email "readme-aura@users.noreply.github.com"
          git add README.md .github/assets/
          git diff --staged --quiet || git commit -m "chore: update README via readme-aura"
          git push

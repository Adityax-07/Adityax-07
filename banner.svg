  <rect x="126" y="168" width="68"  height="24" rx="12" fill="#161B22" stroke="#00B4D8" stroke-width="0.8"/>
  <text x="160" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#00B4D8" text-anchor="middle">FastAPI</text>

  <rect x="202" y="168" width="66"  height="24" rx="12" fill="#161B22" stroke="#7B2FBE" stroke-width="0.8"/>
  <text x="235" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#7B2FBE" text-anchor="middle">PyTorch</text>

  <rect x="276" y="168" width="56"  height="24" rx="12" fill="#161B22" stroke="#00B4D8" stroke-width="0.8"/>
  <text x="304" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#00B4D8" text-anchor="middle">MLOps</text>


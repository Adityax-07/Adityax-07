<svg width="500" height="310" viewBox="0 0 500 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="310" fill="url(#bgGrad)" rx="14"/>

  <!-- Glow blobs -->
  <ellipse cx="420" cy="60" rx="100" ry="80" fill="#00B4D8" opacity="0.07"/>
  <ellipse cx="80" cy="270" rx="90" ry="70" fill="#7B2FBE" opacity="0.08"/>

  <!-- Dot grid top-right -->
  <g fill="#21262D">
    <circle cx="390" cy="18" r="1.5"/><circle cx="410" cy="18" r="1.5"/><circle cx="430" cy="18" r="1.5"/><circle cx="450" cy="18" r="1.5"/><circle cx="470" cy="18" r="1.5"/>
    <circle cx="390" cy="38" r="1.5"/><circle cx="410" cy="38" r="1.5"/><circle cx="430" cy="38" r="1.5"/><circle cx="450" cy="38" r="1.5"/><circle cx="470" cy="38" r="1.5"/>
    <circle cx="390" cy="58" r="1.5"/><circle cx="410" cy="58" r="1.5"/><circle cx="430" cy="58" r="1.5"/><circle cx="450" cy="58" r="1.5"/><circle cx="470" cy="58" r="1.5"/>
    <circle cx="390" cy="78" r="1.5"/><circle cx="410" cy="78" r="1.5"/><circle cx="430" cy="78" r="1.5"/><circle cx="450" cy="78" r="1.5"/><circle cx="470" cy="78" r="1.5"/>
  </g>


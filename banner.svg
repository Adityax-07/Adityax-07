<svg width="480" height="190" viewBox="0 0 480 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
  </defs>

  <!-- Background blends with GitHub dark (#0D1117) -->
  <rect width="480" height="190" fill="#0D1117"/>

  <!-- Faint glow -->
  <ellipse cx="200" cy="75" rx="220" ry="65" fill="#00B4D8" opacity="0.04"/>

  <!-- Name -->
  <text x="4" y="76"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="52" font-weight="800"
    fill="url(#ng)">Aditya Bisht</text>

  <!-- Thin gradient separator -->
  <rect x="4" y="90" width="300" height="2" fill="url(#ng)" rx="1"/>

  <!-- Role — all-caps, letter-spaced, muted -->
  <text x="4" y="120"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="14" letter-spacing="3"
    fill="#8B949E">AI &amp; ML ENGINEER</text>

  <!-- Tagline — serif italic, very subtle -->
  <text x="6" y="162"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13" font-style="italic"
    fill="#484F58">Building intelligent systems at scale.</text>
</svg>

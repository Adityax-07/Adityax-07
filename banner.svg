  <text x="38" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8B949E">B.Tech IT  ·  MAIT GGSIPU  ·  CGPA: 8.0</text>

  <!-- Oracle certs line -->

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Aditya — Applied AI engineer</title>
  <desc id="desc">A terminal-inspired banner reading I benchmark, not just build.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#30363D" stroke-width="1" opacity=".48"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2CE8A0"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
      .cursor{animation:blink 1.1s steps(1,end) infinite}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.cursor{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="258" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M1 49h798" stroke="#30363D"/>
  <rect x="1" y="50" width="798" height="209" fill="url(#grid)" opacity=".7"/>
  <circle cx="25" cy="25" r="5" fill="#F2B84B"/>
  <circle cx="43" cy="25" r="5" fill="#58A6FF"/>
  <circle cx="61" cy="25" r="5" fill="#2CE8A0"/>
  <text x="88" y="30" class="mono" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9198A1">ADITYA // APPLIED AI</text>
  <text x="745" y="30" class="mono" font-size="12" text-anchor="end" fill="#9198A1">DEL / IN</text>
  <rect x="36" y="76" width="5" height="112" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="115" class="mono" font-size="45" font-weight="750" fill="#F0F6FC">I benchmark,</text>
  <text x="64" y="166" class="mono" font-size="45" font-weight="750" fill="#F0F6FC">not just build.</text>
  <text x="65" y="207" class="mono" font-size="15" fill="#9198A1">$ focus --agents --evals --inference</text>
  <rect class="cursor" x="393" y="193" width="9" height="18" rx="1" fill="#2CE8A0"/>
  <g class="mono" font-size="12" font-weight="700" letter-spacing="1">
    <rect x="523" y="188" width="72" height="29" rx="14.5" fill="#111C2F" stroke="#58A6FF"/>
    <text x="559" y="207" text-anchor="middle" fill="#79C0FF">AGENTS</text>
    <rect x="603" y="188" width="61" height="29" rx="14.5" fill="#0E251D" stroke="#2CE8A0"/>
    <text x="633.5" y="207" text-anchor="middle" fill="#56F0B4">EVALS</text>
    <rect x="672" y="188" width="91" height="29" rx="14.5" fill="#2A2110" stroke="#F2B84B"/>
    <text x="717.5" y="207" text-anchor="middle" fill="#FFD36A">INFERENCE</text>
  </g>
  <path d="M64 231h699" stroke="#30363D"/>
  <circle cx="70" cy="242" r="3" fill="#2CE8A0"/>
  <text x="82" y="246" class="mono" font-size="11" fill="#9198A1">SYSTEMS THAT EXPLAIN THEIR TRADE-OFFS</text>
</svg>
